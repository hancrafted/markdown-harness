# The `integrated` tier: one corpus both Modules govern at once, and one frozen `--check` response.
#
# The `body-structure:` section is written FIRST on purpose. The response orders each file's Module
# blocks by the declared Module set (`frontmatter`, then `body-structure`), never by the order the
# sections appear here, and a config that writes them the other way round is the only way to show it.
# Both Modules carry a Rule named `research`: a Rule id belongs to its Module, so the two never collide.
body-structure:
  rules:
    - ruleId: research
      folders: [docs/research/]
      types: [research]
      intent: 'Research opens with a title and gives its findings, so a reviewer reads it the same way every time.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Findings$' }
    - ruleId: shaped-title
      folders: [docs/shaped/]
      intent: 'A shaped document has exactly one title.'
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: sealed-title
      folders: [docs/sealed/]
      types: [sealed]
      intent: 'A sealed page has exactly one title.'
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: vocabulary
      folders: [docs/vocab/]
      types: [research-report]
      intent: 'A research report in the vocabulary folder has exactly one title.'
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: lenient-notes
      folders: [docs/lenient/]
      types: [note]
      intent: 'A lenient note has exactly one title.'
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: mixed-title
      folders: [docs/mixed/]
      intent: 'A mixed page has exactly one title, whatever its frontmatter does.'
      headings:
        - { purpose: heading, level: 1 }
    # Closed spines beside the first Module. `closed-notes` selects by folder alone; the two typed Rules
    # select by `type` as well, so a miss is the silent miss design-ADR 0021 freezes.
    - ruleId: closed-notes
      folders: [docs/closed/]
      intent: 'A closed note has one title and no other heading, whatever its frontmatter does.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: closed-typed
      folders: [docs/closed-typed/]
      types: [closed-note]
      intent: 'A typed closed note has one title and no other heading.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: closed-only
      folders: [docs/closed-only/]
      types: [closed-only]
      intent: 'A closed-only page has one title and no other heading, and nothing else governs its folder.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }

frontmatter:
  rules:
    - ruleId: research
      folders: [docs/research/]
      excludeFiles:
        - { fileNames: [scratch.md] }
      intent: 'Research says what it is and what it is about, so an agent can choose it without opening it.'
      fields:
        type:
          presence: required
          allowed:
            - { value: research, intent: 'Findings gathered to settle a question, with sources.' }
        description: { presence: required }
    - ruleId: plain-metadata
      folders: [docs/plain/]
      intent: 'Every plain document says what it is.'
      fields:
        type: { presence: required }
    - ruleId: sealed
      folders: [docs/sealed/]
      intent: 'A sealed page carries no frontmatter at all.'
      frontmatter: forbidden
    - ruleId: vocabulary
      folders: [docs/vocab/]
      intent: 'The vocabulary folder admits one kind of document.'
      fields:
        type:
          presence: required
          allowed:
            - { value: research, intent: 'Findings gathered to settle a question, with sources.' }
    - ruleId: lenient
      folders: [docs/lenient/]
      intent: 'A lenient page says what it is about and leaves its type unchecked.'
      fields:
        description: { presence: required }
    - ruleId: mixed
      folders: [docs/mixed/]
      intent: 'A mixed page says what it is.'
      fields:
        type: { presence: required }
    - ruleId: closed
      folders: [docs/closed/]
      intent: 'A closed note says what it is about.'
      fields:
        description: { presence: required }
    - ruleId: closed-typed
      folders: [docs/closed-typed/]
      intent: 'A typed closed note says what it is about and leaves its type unchecked.'
      fields:
        description: { presence: required }
