# Spec: A closed spine (`undefinedHeadings: forbid`) beside `frontmatter` reports every heading no entry names, whatever the frontmatter does, in a Rule that selects by folder alone or by `type` as well.
#
# Rules copied byte for byte from the tier's former shared config, in declared order, with their
# folder tokens unchanged: each Module's selector is what this tier composes, so the cases keep
# their tier-relative paths under docs/.
body-structure:
  rules:
    - ruleId: closed-notes
      folders: [docs/closed/]
      intent: 'A closed note has one title and no other heading, whatever its frontmatter does.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: closed-typed
      folders: [docs/closed-typed/]
      types: [closed-note]
      intent: 'A typed closed note has one title and no other heading.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }

frontmatter:
  rules:
    - ruleId: closed
      folders: [docs/closed/]
      intent: 'A closed note says what it is about.'
      fields:
        description: { presence: required }
    - ruleId: closed-typed
      folders: [docs/closed-typed/]
      intent: 'A typed closed note says what it is about and leaves its type unchecked.'
      fields:
        description: { presence: required }
