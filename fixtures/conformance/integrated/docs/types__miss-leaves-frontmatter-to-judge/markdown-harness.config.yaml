# Spec: A `body-structure` Rule whose `types` a file misses — misspelt, absent or unreadable — silently selects nothing, so `frontmatter` alone judges the file, and a file neither Module selects goes ungoverned.
#
# Rules copied byte for byte from the tier's former shared config, in declared order, with their
# folder tokens unchanged: each Module's selector is what this tier composes, so the cases keep
# their tier-relative paths under docs/.
body-structure:
  rules:
    - ruleId: research
      folders: [docs/research/]
      types: [research]
      intent: 'Research opens with a title and gives its findings, so a reviewer reads it the same way every time.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Findings$' }
    - ruleId: lenient-notes
      folders: [docs/lenient/]
      types: [note]
      intent: 'A lenient note has exactly one title.'
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: closed-typed
      folders: [docs/closed-typed/]
      types: [closed-note]
      intent: 'A typed closed note has one title and no other heading.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: closed-only
      folders: [docs/closed-only/]
      types: [closed-only]
      intent: 'A closed-only page has one title and no other heading, and nothing else governs its folder.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
    - ruleId: titles-typed
      folders: [docs/titles-typed/]
      types: [titled-note]
      intent: 'A typed note has one title, and its second-level headings come from a short fixed set and nothing else.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 0, allowed: [{ title: Added }, { title: Fixed }] }

frontmatter:
  rules:
    - ruleId: research
      folders: [docs/research/]
      excludeFiles:
        - { fileNames: [scratch.md] }
      intent: 'Research says what it is and what it is about, so an agent can choose it without opening it.'
      fields:
        type:
          presence: required
          allowed:
            - { value: research, intent: 'Findings gathered to settle a question, with sources.' }
        description: { presence: required }
    - ruleId: lenient
      folders: [docs/lenient/]
      intent: 'A lenient page says what it is about and leaves its type unchecked.'
      fields:
        description: { presence: required }
    - ruleId: closed-typed
      folders: [docs/closed-typed/]
      intent: 'A typed closed note says what it is about and leaves its type unchecked.'
      fields:
        description: { presence: required }
    - ruleId: titles-typed
      folders: [docs/titles-typed/]
      intent: 'A typed note says what it is about and leaves its type unchecked.'
      fields:
        description: { presence: required }
