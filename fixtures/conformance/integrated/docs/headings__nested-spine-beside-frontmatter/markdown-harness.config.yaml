# Spec: A nested spine judges the outline and each section's content beside `frontmatter`'s findings, and the two blocks come in declared Module order.
#
# Rules copied byte for byte from the tier's former shared config, in declared order, with their
# folder tokens unchanged: each Module's selector is what this tier composes, so the cases keep
# their tier-relative paths under docs/.
body-structure:
  rules:
    - ruleId: titles-notes
      folders: [docs/titles/]
      intent: 'A note has a title and a prose summary, and the headings under the summary come from a short fixed set.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - purpose: heading
          level: 2
          pattern: '^Summary$'
          mayHold: [prose]
          headings:
            - { purpose: enumeration, level: 3, minCount: 0, allowed: [{ title: Added, intent: 'What the note adds.' }, { title: Fixed }], mayHold: [unordered-list] }

frontmatter:
  rules:
    - ruleId: titles
      folders: [docs/titles/]
      intent: 'A note says what it is about.'
      fields:
        description: { presence: required }
