# Spec: A typed Rule's `allowed` titles close its enumeration, so a title outside the set is undefined while `frontmatter`, which leaves `type` unchecked, is satisfied.
#
# Rules copied byte for byte from the tier's former shared config, in declared order, with their
# folder tokens unchanged: each Module's selector is what this tier composes, so the cases keep
# their tier-relative paths under docs/.
body-structure:
  rules:
    - ruleId: titles-typed
      folders: [docs/titles-typed/]
      types: [titled-note]
      intent: 'A typed note has one title, and its second-level headings come from a short fixed set and nothing else.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 0, allowed: [{ title: Added }, { title: Fixed }] }

frontmatter:
  rules:
    - ruleId: titles-typed
      folders: [docs/titles-typed/]
      intent: 'A typed note says what it is about and leaves its type unchecked.'
      fields:
        description: { presence: required }
