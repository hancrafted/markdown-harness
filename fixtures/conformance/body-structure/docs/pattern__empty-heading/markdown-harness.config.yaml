# Spec: An empty heading has the empty string as its content, which `^$` matches.
# Rules copied from the tier's former shared config in declared order, each folder token rewritten to './'.
body-structure:
  rules:
    - ruleId: empty-heading
      folders: ['./']
      intent: 'An empty second-level heading is a heading whose content is the empty string.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^$' }
