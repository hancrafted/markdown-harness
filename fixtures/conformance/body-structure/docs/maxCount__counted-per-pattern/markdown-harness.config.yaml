# Spec: Two enumerations at one level count their repeats apart, each against its own `maxCount`.
# Rules copied from the tier's former shared config in declared order, each folder token rewritten to './'.
body-structure:
  rules:
    - ruleId: kinds
      folders: ['./']
      intent: 'A trade-off page lists at most one pro and at most one con, counted apart.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Pro: ', maxCount: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Con: ', maxCount: 1 }
