# Spec: Nested `headings` lists four deep report each violation at its own entry path.
# Rules copied from the tier's former shared config in declared order, each folder token rewritten to './'.
body-structure:
  rules:
    - ruleId: guides
      types: [guide]
      intent: 'A guide is a title and at least two sections, wherever it lives.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 2 }

    - ruleId: nested-depth
      folders: ['./']
      intent: 'A guide has one title, at least one part, and in every part a summary that gives its details.'
      headings:
        - purpose: heading
          level: 1
          headings:
            - purpose: enumeration
              level: 2
              minCount: 1
              headings:
                - purpose: heading
                  level: 3
                  allowed: [{ title: Summary }]
                  headings:
                    - { purpose: heading, level: 5, allowed: [{ title: Details }] }
