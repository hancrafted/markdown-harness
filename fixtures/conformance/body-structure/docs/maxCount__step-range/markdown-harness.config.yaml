# Spec: An enumeration bounded by `minCount` and `maxCount` reports a run outside the range, and a heading its pattern does not name.
# Rules copied from the tier's former shared config in declared order, each folder token rewritten to './'.
body-structure:
  rules:
    - ruleId: guides
      types: [guide]
      intent: 'A guide is a title and at least two sections, wherever it lives.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 2 }

    - ruleId: steps
      folders: ['./']
      intent: 'A procedure has a title and between two and four steps.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Step [0-9]+$', minCount: 2, maxCount: 4, intent: 'One action, written as an instruction.' }
