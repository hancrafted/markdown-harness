# Spec: Every name a `fileNames` list writes selects, compared whole and case-sensitively.
# Selector reach: cases keep their tier paths, and every competing Rule is copied byte for byte in declared order,
# because the first Rule that selects a file wins it.
body-structure:
  rules:
    - ruleId: guides
      types: [guide]
      intent: 'A guide is a title and at least two sections, wherever it lives.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 2 }

    - ruleId: plural-names
      fileNames: [README.md, GUIDE.md, NOTES.md]
      intent: 'Three named files share one shape, so the second and the third name must select as surely as the first.'
      headings:
        - { purpose: heading, level: 1 }
