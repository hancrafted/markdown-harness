# Spec: An unanchored pattern matches anywhere in the heading, case-sensitively.
# Rules copied from the tier's former shared config in declared order, each folder token rewritten to './'.
body-structure:
  rules:
    - ruleId: substring-titles
      folders: ['./']
      intent: 'A log names a decision somewhere in its second-level heading.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: 'Decision' }
