# Spec: `undefinedHeadings: forbid` reports headings no entry names, while the spine still reports missing and misplaced entries.
# Rules copied from the tier's former shared config in declared order, each folder token rewritten to './'.
body-structure:
  rules:
    - ruleId: guides
      types: [guide]
      intent: 'A guide is a title and at least two sections, wherever it lives.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 2 }

    - ruleId: closed-record
      folders: ['./']
      intent: 'A decision record has a title and its sections in a fixed order and nothing else, so a reader finds the status and the decision without hunting through extras.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Status$', intent: 'Proposed, accepted or superseded, with the date.' }
        - { purpose: heading, level: 2, pattern: '^Decision$', intent: 'What was decided and why.' }
        - { purpose: heading, level: 2, pattern: '^Consequences$', presence: optional, intent: 'What gets easier and what gets harder.' }
