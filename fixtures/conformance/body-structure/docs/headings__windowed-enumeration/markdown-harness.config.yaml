# Spec: An enumeration between two heading entries claims only the repeats between them, in order.
# Rules copied from the tier's former shared config in declared order, each folder token rewritten to './'.
body-structure:
  rules:
    - ruleId: windowed
      folders: ['./']
      intent: 'A chaptered page has an Intro, any number of Parts and a Conclusion, in that order.'
      maxLevel: 3
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Intro$' }
        - { purpose: enumeration, level: 2, pattern: '^Part: ', minCount: 1 }
        - { purpose: heading, level: 2, pattern: '^Conclusion$' }
