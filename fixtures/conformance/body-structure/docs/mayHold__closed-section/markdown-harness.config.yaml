# Spec: `mayHold` and `undefinedHeadings: forbid` report apart, so one section can fail both.
# Rules copied from the tier's former shared config in declared order, each folder token rewritten to './'.
body-structure:
  rules:
    - ruleId: section-closed
      folders: ['./']
      intent: 'A brief has a title and a summary written as prose, and no other heading.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Summary$', mayHold: [prose] }
