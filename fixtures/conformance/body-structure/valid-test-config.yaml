# The `body-structure` Module's own Conformance tier: one config, written relative to this directory.
#
# The rule list is ORDERED and the first match wins outright, so the order below is part of what the
# cases specify. A Rule's template is a spine: an ordered `headings:` list of `heading` entries (one
# heading each) and `enumeration` entries (a counted run of repeats), plus an optional `maxLevel:`.
# Rules above `plural-names` select by path, by type or by both; the groups after `open-template` each
# own one folder under `docs/` and exist to isolate one behaviour. Which Rule wins a given file is
# stated in every case's argument.
body-structure:
  rules:
    - ruleId: index-pages
      fileNames: [index.md]
      intent: 'An index page names its folder and lists what is in it, so it has one title and nothing deeper than the second level.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }

    - ruleId: decision-records
      folders: [docs/decisions/]
      types: [decision]
      intent: 'A decision record reads the same way every time, so a reviewer finds the status and the reasoning without hunting.'
      maxLevel: 3
      headings:
        - { purpose: heading, level: 1, intent: 'The decision, stated as a short noun phrase.' }
        - { purpose: heading, level: 2, pattern: '^Status$', intent: 'Proposed, accepted or superseded, with the date.' }
        - { purpose: heading, level: 2, pattern: '^Context$', intent: 'The forces that made a decision necessary.' }
        - { purpose: heading, level: 2, pattern: '^Decision$', intent: 'What was decided and why.' }
        - { purpose: heading, level: 2, pattern: '^Consequences$', presence: optional, intent: 'What gets easier and what gets harder.' }

    - ruleId: research-reports
      folders: [docs/research/]
      types: [research]
      excludeFiles:
        - { fileNames: [scratch.md] }
      intent: 'Research reads the same way every time, so a reviewer can skim it for findings and sources.'
      maxLevel: 3
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Findings$', intent: 'What was measured, with numbers.' }
        - { purpose: enumeration, level: 3, pattern: '^Detail', maxCount: 2, intent: 'Supporting detail under Findings, two at most.' }
        - { purpose: enumeration, level: 2, pattern: '^Source: ', minCount: 1, intent: 'One section per source consulted.' }

    - ruleId: research-notes
      folders: [docs/research/]
      types: [note, memo, brief]
      intent: 'A research note is short, so it has one title and at most three sections.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, maxCount: 3 }

    - ruleId: research-untyped
      folders: [docs/research/]
      intent: 'A research file whose type names no template here still has exactly one title and nothing beneath it.'
      maxLevel: 1
      headings:
        - { purpose: heading, level: 1 }

    - ruleId: guides
      types: [guide]
      intent: 'A guide is a title and at least two sections, wherever it lives.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 2 }

    - ruleId: changelogs
      folders: [docs/releases/]
      fileNames: [CHANGELOG.md, HISTORY.md, RELEASES.md]
      types: [changelog]
      intent: 'A changelog is titled as one and carries one section per release.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1, pattern: '^Changelog$' }
        - { purpose: enumeration, level: 2, pattern: '^Release ', minCount: 1 }

    - ruleId: recognition
      folders: [docs/recognition/]
      intent: 'A recognition case has one title and at most one second-level heading, so a heading read wrongly flips its verdict.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, maxCount: 1 }

    - ruleId: open-template
      folders: [docs/handbook/, docs/manual/]
      intent: 'A handbook or manual page opens with a title and an Overview, and may nest as deep as it needs.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Overview$', intent: 'What the page covers, in a paragraph.' }

    - ruleId: plural-names
      fileNames: [README.md, GUIDE.md, NOTES.md]
      intent: 'Three named files share one shape, so the second and the third name must select as surely as the first.'
      headings:
        - { purpose: heading, level: 1 }

    - ruleId: triple-plural
      folders: [docs/tp/one/, docs/tp/two/, docs/tp/three/]
      fileNames: [a.md, b.md, c.md]
      types: [t1, t2, t3]
      intent: 'Every axis lists three values, so a file is governed only when each axis matches and the match need not be the first listed.'
      headings:
        - { purpose: heading, level: 1 }

    - ruleId: depth-only
      folders: [docs/depth/]
      intent: 'A depth-only Rule forbids nesting past the second level and asks nothing else of the outline.'
      maxLevel: 2

    - ruleId: steps
      folders: [docs/steps/]
      intent: 'A procedure has a title and between two and four steps.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Step [0-9]+$', minCount: 2, maxCount: 4, intent: 'One action, written as an instruction.' }

    - ruleId: pairs
      folders: [docs/pairs/]
      intent: 'A comparison has a title and exactly two sections, whatever they are called.'
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 2, maxCount: 2 }

    - ruleId: free-sections
      folders: [docs/free/]
      intent: 'A free page has a title and any number of second-level sections, none included.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 0 }

    - ruleId: kinds
      folders: [docs/kinds/]
      intent: 'A trade-off page lists at most one pro and at most one con, counted apart.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Pro: ', maxCount: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Con: ', maxCount: 1 }

    - ruleId: windowed
      folders: [docs/windowed/]
      intent: 'A chaptered page has an Intro, any number of Parts and a Conclusion, in that order.'
      maxLevel: 3
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Intro$' }
        - { purpose: enumeration, level: 2, pattern: '^Part: ', minCount: 1 }
        - { purpose: heading, level: 2, pattern: '^Conclusion$' }

    - ruleId: swallow
      folders: [docs/swallow/]
      intent: 'A page of free second-level sections that ends in a Conclusion.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, minCount: 1 }
        - { purpose: heading, level: 2, pattern: '^Conclusion$' }

    - ruleId: anonymous-pair
      folders: [docs/anon/]
      intent: 'A page with a title and exactly two second-level headings, whatever they say.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2 }
        - { purpose: heading, level: 2 }

    - ruleId: suffix-titles
      folders: [docs/suffix/]
      intent: 'A report is titled as one.'
      headings:
        - { purpose: heading, level: 1, pattern: ' Report$' }

    - ruleId: sentence-titles
      folders: [docs/sentence/]
      intent: 'A how-to is titled in the shape of an instruction.'
      headings:
        - { purpose: heading, level: 1, pattern: '^How to [a-z]+( [a-z]+)*$' }

    - ruleId: short-titles
      folders: [docs/length/]
      intent: 'A code page has a title of two or three characters.'
      headings:
        - { purpose: heading, level: 1, pattern: '^.{2,3}$' }

    - ruleId: substring-titles
      folders: [docs/substring/]
      intent: 'A log names a decision somewhere in its second-level heading.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: 'Decision' }

    - ruleId: closed-set
      folders: [docs/alternation/]
      intent: 'An evaluation has a title and one or two sections, each a Pros or a Cons.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, pattern: '^(Pros|Cons)$', minCount: 1, maxCount: 2 }

    - ruleId: loose-alternation
      folders: [docs/loose-alternation/]
      intent: 'An unparenthesised alternation, written as the Operator wrote it.'
      headings:
        - { purpose: heading, level: 1, pattern: '^Pros|Cons$' }

    - ruleId: escaped-literals
      folders: [docs/escaped/]
      intent: 'A title with characters a regular expression gives meaning to.'
      headings:
        - { purpose: heading, level: 1, pattern: '^C\+\+ \(draft\)$' }

    - ruleId: raw-markup
      folders: [docs/raw/]
      intent: 'A pattern is compared with a heading as written, inline markup included.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^\*\*Findings\*\*$' }

    - ruleId: setext-lines
      folders: [docs/setext/]
      intent: 'A two-line setext heading keeps its line break, so a pattern can name it.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Source:\nOne$' }

    - ruleId: no-dotall
      folders: [docs/dotall/]
      intent: 'A dot is not a line break.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Source:.One$' }

    - ruleId: no-multiline
      folders: [docs/multiline/]
      intent: 'A caret anchors the whole heading, not each of its lines.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^One$' }

    - ruleId: empty-heading
      folders: [docs/empty/]
      intent: 'An empty second-level heading is a heading whose content is the empty string.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^$' }

    # Closed spines. Every Rule below writes `undefinedHeadings` and owns one folder under `docs/`. No Rule
    # above writes the key, because its absence is the open spine every case above relies on: a heading no
    # entry matches is permitted. `closed-bare` writes no `headings` at all, and `open-sources` writes the
    # default out beside `maxLevel`, the one pairing the key admits.
    - ruleId: closed-record
      folders: [docs/closed-record/]
      intent: 'A decision record has a title and its sections in a fixed order and nothing else, so a reader finds the status and the decision without hunting through extras.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Status$', intent: 'Proposed, accepted or superseded, with the date.' }
        - { purpose: heading, level: 2, pattern: '^Decision$', intent: 'What was decided and why.' }
        - { purpose: heading, level: 2, pattern: '^Consequences$', presence: optional, intent: 'What gets easier and what gets harder.' }

    - ruleId: closed-levels
      folders: [docs/closed-levels/]
      intent: 'A one-section page names its single heading, so a title or any deeper heading is a heading the page was not meant to have.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 2, pattern: '^Overview$' }

    - ruleId: closed-sources
      folders: [docs/closed-sources/]
      intent: 'A report has a title, one or two sources and a conclusion, and no other heading.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Source: ', minCount: 1, maxCount: 2 }
        - { purpose: heading, level: 2, pattern: '^Conclusion$' }

    - ruleId: open-sources
      folders: [docs/open-sources/]
      intent: 'The same report shape as closed-sources with the default written out, so headings no entry names are permitted down to the second level.'
      undefinedHeadings: allow
      maxLevel: 2
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Source: ', minCount: 1, maxCount: 2 }
        - { purpose: heading, level: 2, pattern: '^Conclusion$' }

    - ruleId: closed-bare
      folders: [docs/closed-bare/]
      intent: 'A log entry is plain text and carries no heading at all.'
      undefinedHeadings: forbid

    # Nested spines, exact titles and section content. Every Rule below owns one folder under `docs/`;
    # none writes a `type` except `adr-contract`, and none can shadow or be shadowed by a Rule above, whose
    # folders are all different. No Rule above writes `allowed`, a nested `headings:` or `mayHold`, because
    # their absence is the default every case above relies on: any title, nothing asked inside a section,
    # and any block in it.
    #
    # `nested-changelog` is a strict Keep a Changelog file: a closed spine whose release enumeration
    # carries one optional entry per change type, in the order the convention lists them. Its nested
    # spine is walked once under every release heading the enumeration claims, over the headings under
    # that release alone.
    - ruleId: nested-changelog
      folders: [docs/nested-changelog/]
      intent: 'A changelog has one title and a heading per release, and each release lists its changes under at most one heading per change type, in the order Keep a Changelog gives them.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1, allowed: [{ title: Changelog }] }
        - purpose: enumeration
          level: 2
          pattern: '^\['
          minCount: 1
          headings:
            - { purpose: heading, level: 3, presence: optional, allowed: [{ title: Added, intent: 'New features.' }] }
            - { purpose: heading, level: 3, presence: optional, allowed: [{ title: Changed, intent: 'Changes in existing functionality.' }] }
            - { purpose: heading, level: 3, presence: optional, allowed: [{ title: Deprecated, intent: 'Soon-to-be removed features.' }] }
            - { purpose: heading, level: 3, presence: optional, allowed: [{ title: Removed, intent: 'Now removed features.' }] }
            - { purpose: heading, level: 3, presence: optional, allowed: [{ title: Fixed, intent: 'Any bug fixes.' }] }
            - { purpose: heading, level: 3, presence: optional, allowed: [{ title: Security, intent: 'In case of vulnerabilities.' }] }

    # `nested-adr` is an open spine whose fixed sections each carry their own sub-template: `Options`
    # holds a run of `### Option …` headings and `Consequences` holds `### Positive` then `### Negative`.
    - ruleId: nested-adr
      folders: [docs/nested-adr/]
      intent: 'A decision record weighs at least two options and then states what follows, good and bad, each as a bulleted list.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, allowed: [{ title: Context }] }
        - purpose: heading
          level: 2
          allowed: [{ title: Options, intent: 'The choices weighed, one heading each.' }]
          headings:
            - { purpose: enumeration, level: 3, pattern: '^Option ', minCount: 2 }
        - { purpose: heading, level: 2, allowed: [{ title: Decision }] }
        - purpose: heading
          level: 2
          allowed: [{ title: Consequences }]
          headings:
            - { purpose: heading, level: 3, allowed: [{ title: Positive }], mayHold: [unordered-list] }
            - { purpose: heading, level: 3, allowed: [{ title: Negative }], mayHold: [unordered-list] }

    # `nested-depth` nests four lists deep, one level apart and then skipping one, so a violation's
    # entry path and its `under` are frozen at every depth.
    - ruleId: nested-depth
      folders: [docs/nested-depth/]
      intent: 'A guide has one title, at least one part, and in every part a summary that gives its details.'
      headings:
        - purpose: heading
          level: 1
          headings:
            - purpose: enumeration
              level: 2
              minCount: 1
              headings:
                - purpose: heading
                  level: 3
                  allowed: [{ title: Summary }]
                  headings:
                    - { purpose: heading, level: 5, allowed: [{ title: Details }] }

    # `allowed-titles` names its titles by exact list rather than by pattern: a heading entry with two
    # titles, and an enumeration with one, whose title repeats inside its run.
    - ruleId: allowed-titles
      folders: [docs/allowed-titles/]
      intent: 'A journal is titled Notes or Journal and holds at least one entry, every one titled Entry.'
      headings:
        - { purpose: heading, level: 1, allowed: [{ title: Notes, intent: 'A shared journal.' }, { title: Journal }] }
        - { purpose: enumeration, level: 2, minCount: 1, allowed: [{ title: Entry }] }

    # Section content. `section-kinds` writes six optional entries, one per allowed set, so each case
    # needs only the section it is about; the entry order is Prose, Ordered, Bullets, Mixed, Anything,
    # Free, and a case that holds two sections writes them in that order. `Free` writes no `mayHold`.
    - ruleId: section-kinds
      folders: [docs/section-kinds/]
      intent: 'Each section says which kinds of block it may hold, so a reader meets a numbered list where an order matters and prose where an argument is made.'
      headings:
        - { purpose: heading, level: 2, pattern: '^Prose$', presence: optional, mayHold: [prose] }
        - { purpose: heading, level: 2, pattern: '^Ordered$', presence: optional, mayHold: [ordered-list] }
        - { purpose: heading, level: 2, pattern: '^Bullets$', presence: optional, mayHold: [unordered-list] }
        - { purpose: heading, level: 2, pattern: '^Mixed$', presence: optional, mayHold: [prose, ordered-list] }
        - { purpose: heading, level: 2, pattern: '^Anything$', presence: optional, mayHold: [prose, ordered-list, unordered-list] }
        - { purpose: heading, level: 2, pattern: '^Free$', presence: optional }

    - ruleId: section-steps
      folders: [docs/section-steps/]
      intent: 'A procedure has a title and one section per step, and each step holds a numbered list and nothing else.'
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: enumeration, level: 2, pattern: '^Step: ', minCount: 1, mayHold: [ordered-list] }

    - ruleId: section-nested
      folders: [docs/section-nested/]
      intent: 'A decision is argued in prose and then broken into numbered anchors, each of which holds a numbered list.'
      headings:
        - { purpose: heading, level: 2, pattern: '^Decision$', mayHold: [prose] }
        - { purpose: enumeration, level: 3, pattern: '^[0-9]+\. ', minCount: 1, mayHold: [ordered-list] }

    - ruleId: section-closed
      folders: [docs/section-closed/]
      intent: 'A brief has a title and a summary written as prose, and no other heading.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Summary$', mayHold: [prose] }

    # The ADR Contract (GEN-001) body, dogfooded. Selected by folder and by `type: adr`, so a file with a
    # misspelt type is the deliberate silent miss. It states the body's section shape and the
    # block kind each section holds, and nothing about what is inside a list item.
    - ruleId: adr-contract
      folders: [docs/adr/]
      types: [adr]
      intent: 'An ADR has a title and six sections in a fixed order: its context is prose, its decisions are numbered anchors each holding a numbered list, its do and dont blocks are numbered lists, and its references are a bulleted list.'
      undefinedHeadings: forbid
      headings:
        - { purpose: heading, level: 1 }
        - { purpose: heading, level: 2, pattern: '^Context$', mayHold: [prose] }
        - { purpose: heading, level: 2, pattern: '^Decision$' }
        - { purpose: enumeration, level: 3, pattern: '^[0-9]+\. ', minCount: 1, mayHold: [ordered-list] }
        - { purpose: heading, level: 2, pattern: "^Do's and Don'ts$" }
        - { purpose: heading, level: 3, pattern: "^Do's$", mayHold: [ordered-list] }
        - { purpose: heading, level: 3, pattern: "^Don'ts$", mayHold: [ordered-list] }
        - { purpose: heading, level: 2, pattern: '^Consequences$', mayHold: [prose, ordered-list] }
        - { purpose: heading, level: 2, pattern: '^Compliance and Enforcement$', mayHold: [prose, ordered-list] }
        - { purpose: heading, level: 2, pattern: '^References$', mayHold: [unordered-list] }
