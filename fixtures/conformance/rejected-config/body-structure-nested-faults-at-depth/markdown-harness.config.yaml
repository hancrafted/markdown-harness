# body-structure rejected-config case: nested faults at depth.
# Frozen faults are in expected-rejection.json beside this file; see the nested-spine spec (#229).
body-structure:
  rules:
    - ruleId: nested
      folders: [docs/]
      intent: 'A nested list is validated in the same grammar as the top one, so each fault below is one a top-level entry earns too.'
      maxLevel: 2
      headings:
        - purpose: heading
          level: 1
          headings:
            - { purpose: enumeration, level: 2 }
            - { purpose: heading, level: 3, minCount: 1, headings: [] }
            - { purpose: heading, level: 3, headings: Notes }
