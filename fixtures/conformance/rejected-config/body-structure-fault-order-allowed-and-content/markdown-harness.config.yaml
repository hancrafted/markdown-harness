# body-structure rejected-config case: fault order allowed and content.
# Frozen faults are in expected-rejection.json beside this file; see the nested-spine spec (#229).
body-structure:
  rules:
    - ruleId: ordered
      folders: [docs/]
      types: []
      intent: 'A Rule that carries faults from every stage, so the position of the allowed, content and nested faults among them is frozen.'
      extra: 1
      maxLevel: 2
      headings:
        - purpose: heading
          level: 1
          pattern: '^A$'
          allowed: [{ title: A }, { title: A, intent: '' }]
          intent: ''
          mayHold: []
          headings:
            - { purpose: heading, level: 1 }
            - { purpose: heading, level: 3 }
