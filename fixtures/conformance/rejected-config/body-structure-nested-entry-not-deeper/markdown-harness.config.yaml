# body-structure rejected-config case: nested entry not deeper.
# Frozen faults are in expected-rejection.json beside this file; see the nested-spine spec (#229).
body-structure:
  rules:
    - ruleId: level
      folders: [docs/a/]
      intent: 'A child at its parent level is refused, so only the fault below is reported.'
      headings:
        - { purpose: heading, level: 2, headings: [{ purpose: heading, level: 2 }] }
    - ruleId: shallower
      folders: [docs/b/]
      intent: 'A child shallower than its parent is refused two lists down, so only the fault below is reported.'
      headings:
        - purpose: heading
          level: 1
          headings:
            - { purpose: enumeration, level: 3, minCount: 1, headings: [{ purpose: heading, level: 2 }] }
