# body-structure rejected-config case: fault order one module.
# Frozen faults are in expected-rejection.json beside this file; see the round-two spec (#221).
body-structure:
  not-a-section-key: true
  rules:
    - ruleId: first
      folders: [docs/]
      intent: ''
      maxLevel: 1
      headings:
        - { purpose: enumeration, level: 2, pattern: '^Findings$', presence: optional, minCount: -1, intent: '', extra: 1 }
    - ruleId: first
      folders: [docs/]
      intent: 'A second Rule that claims the first one''s id.'
      types: []
      headings: [{ purpose: heading, level: 1 }]
