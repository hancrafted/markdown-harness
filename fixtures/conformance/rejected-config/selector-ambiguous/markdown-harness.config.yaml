# A rule carrying both `path` and `fileName`.
#
# `fileName` is sugar for a path glob, so two selectors on one rule are two
# answers to a question that has one. Neither can be quietly preferred: whichever
# the resolver picked would be a precedence rule nobody wrote down.
frontmatter:
  rules:
    - ruleId: selects-twice
      path: ['docs/**/*.md']
      fileName: log.md
      intent: A rule written with both selector axes at once.
