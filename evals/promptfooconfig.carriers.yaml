# The carriers matrix: one case with two tested carriers (the Findings entry's intent and the frontmatter Rule's
# intent), one steering marker each, delivered through the pull command's raw JSON. A steered session that
# follows one steering marker and not the other is rung 9, and the profile names the carrier that decayed. The push hook
# renders body-structure only, so this matrix has no push cell; the case file says why.
#
# Residual, rung 9 across encodings: the two-carrier case runs on raw JSON pull only, so whether a carrier decays
# differently under the prose or the intents-only encoding is not measured. Rung 9's profile is therefore a
# raw-JSON finding, and a claim about another encoding needs its own carriers cell.
#
# Run it through the wrapper (`--matrix carriers`), never directly.
description: steering eval, Claude Code, pull delivery, two tested carriers
prompts:
  - '{{task}}'
providers:
  - id: file://packages/adapters/claude-provider.ts
    label: pull-json-steered
    config:
      { arm: steered, deliveryChannel: pull, shell: query-only, encoding: json, model: sonnet, hostName: claude-code }
  - id: file://packages/adapters/claude-provider.ts
    label: pull-json-neutralised
    config:
      {
        arm: neutralised,
        deliveryChannel: pull,
        shell: query-only,
        encoding: json,
        model: sonnet,
        hostName: claude-code,
      }
  - id: file://packages/adapters/claude-provider.ts
    label: trusted-prompt-control
    config:
      { arm: control, deliveryChannel: user-turn, shell: none, encoding: none, model: sonnet, hostName: claude-code }
tests: file://suites/steering/cases/research-note-carriers.yaml
defaultTest:
  assert:
    - type: javascript
      value: file://packages/adapters/steering-assertion.ts:gradeSteering
evaluateOptions:
  maxConcurrency: 1
  cache: false
